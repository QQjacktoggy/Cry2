strategy:
  variant: baseline_grid

exchange:
  name: binance
  mode: testnet
  base_url: https://testnet.binancefuture.com
  ws_url: wss://fstream.binancefuture.com
  api_key_env: BINANCE_TESTNET_API_KEY
  api_secret_env: BINANCE_TESTNET_API_SECRET

trading:
  symbols: [ETHUSDC]
  timeframe: 5m
  total_capital_usd: 150
  per_symbol_alloc_pct: 50
  compound_pct: 50.0

grid:
  default_grid_count: 8
  max_leverage: 10
  min_leverage: 9
  warmup_bars: 50

exposure:
  max_total_notional_multiplier: 2.0

targets:
  daily_profit_target_usd: 4.5
  daily_loss_limit_pct: 10.0
  grid_stop_loss_pct: 3.0

review:
  hourly_review_interval_bars: 12

conservative:
  conservative_size_factor: 0.25
  conservative_grid_spacing_mult: 2.0
  conservative_leverage: 9

risk:
  max_concurrent_grids: 2
  max_daily_resets: 10

fees:
  maker: 0.00018
  taker: 0.00045

market_assessor:
  adx_period: 14
  trending_threshold: 25.0
  ranging_threshold: 20.0
  bb_period: 20
  bb_std: 2.0
  atr_period: 14

variants:
  baseline_grid:
    expected_edge_floor_bps: 0.0
    breakout_cooldown_bars: 0
    slippage_buffer_bps: 0.0
    safety_margin_bps: 0.0
    adaptive_spacing_adx_weight: 0.0
    adaptive_spacing_atr_weight: 0.0
    adaptive_spacing_max_mult: 1.0
    grid_allocation_pct: 100.0
    trend_allocation_pct: 0.0
    buffer_allocation_pct: 0.0

  fee_aware_grid:
    expected_edge_floor_bps: 6.0
    breakout_cooldown_bars: 18
    slippage_buffer_bps: 2.0
    safety_margin_bps: 1.5
    adaptive_spacing_adx_weight: 0.35
    adaptive_spacing_atr_weight: 0.8
    adaptive_spacing_max_mult: 2.15
    max_daily_resets: 6
    grid_allocation_pct: 100.0
    trend_allocation_pct: 0.0
    buffer_allocation_pct: 0.0

  hybrid_trend_grid:
    expected_edge_floor_bps: 6.5
    breakout_cooldown_bars: 24
    slippage_buffer_bps: 2.5
    safety_margin_bps: 1.8
    adaptive_spacing_adx_weight: 0.45
    adaptive_spacing_atr_weight: 0.9
    adaptive_spacing_max_mult: 2.3
    max_daily_resets: 6
    grid_allocation_pct: 75.0
    trend_allocation_pct: 15.0
    buffer_allocation_pct: 10.0
    directional_adx_threshold: 24.0
    trend_activation_adx: 32.0
    trend_activation_slope: 1.5
    trend_trailing_atr_mult: 2.8

telegram:
  enabled: true
  bot_token_env: TELEGRAM_BOT_TOKEN
  chat_id_env: TELEGRAM_CHAT_ID
