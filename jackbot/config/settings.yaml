# ============================================================
# Jackbot_V1 — 幣安合約網格日內交易機器人
# ============================================================

exchange:
  name: binance
  mode: testnet
  base_url: https://testnet.binancefuture.com
  ws_url: wss://fstream.binancefuture.com
  api_key_env: BINANCE_TESTNET_API_KEY
  api_secret_env: BINANCE_TESTNET_API_SECRET

trading:
  symbols: [BTCUSDT, ETHUSDT]
  timeframe: 5m
  total_capital_usd: 150
  per_symbol_alloc_pct: 50       # 每幣種 75 USDT
  compound_pct: 50.0             # 每日利潤的 50% 滾入本金

grid:
  default_grid_count: 10
  max_leverage: 10               # 逐倉最高 10x (A3a: 從 20x 降低以減少 taker 費用衝擊)
  min_leverage: 5                # 逐倉最低 5x
  warmup_bars: 50                # 50 x 5m = ~4h 預熱

exposure:
  max_total_notional_multiplier: 2.0  # 所有活躍 grid 總 notional ≤ 本金 × 2

targets:
  daily_profit_target_usd: 10    # 日標 10 USDT
  daily_loss_limit_pct: 10.0     # 日虧上限: 總本金的 10%
  grid_stop_loss_pct: 3.0        # 單網格止損: 浮虧 > 投入的 3% 就平倉

review:
  hourly_review_interval_bars: 12  # 12 x 5m = 每小時 review 一次

conservative:
  conservative_size_factor: 0.25
  conservative_grid_spacing_mult: 2.0
  conservative_leverage: 3

risk:
  max_concurrent_grids: 2
  max_daily_resets: 10

fees:
  maker: 0.0        # Grid 限價單被動成交 (Binance Regular maker rebate)
  taker: 0.0004     # SL / breakout / review 平倉市價單 (0.04%)

market_assessor:
  adx_period: 14
  trending_threshold: 25.0
  ranging_threshold: 20.0
  bb_period: 20
  bb_std: 2.0
  atr_period: 14

# Phase A optimisations — all OFF by default; enable per-flag for A/B backtests.
optimizations:
  # t1-dynamic-spacing: regime-aware grid spacing via ATR × k
  dynamic_spacing_enabled: false
  dynamic_spacing_tick_size: 0.1
  dynamic_spacing_k_trending: 0.8
  dynamic_spacing_k_neutral: 0.6
  dynamic_spacing_k_ranging: 0.4
  dynamic_spacing_min_count: 5
  dynamic_spacing_max_count: 30

  # t1-partial-tp-trailing: lock 50% at +1% move, trail rest by 0.5×ATR
  partial_tp_enabled: false
  partial_tp_pct: 1.0
  partial_tp_close_pct: 0.5
  trailing_atr_mult: 0.5

  # t1-maker-only-close: post-only LIMIT reduce-only when grid closes
  # (live runner falls back to MARKET if not filled in 5s — TODO)
  maker_only_close: false
  maker_close_tick_size: 0.1

  # t1-drawdown-throttle: graduated sizing tiers — replaces binary daily halt
  graduated_throttle_enabled: false
  throttle_tier1_loss_pct: 3.0
  throttle_tier2_loss_pct: 5.0
  throttle_tier3_loss_pct: 8.0
  throttle_tier1_factor: 0.7
  throttle_tier2_factor: 0.4
  throttle_tier3_factor: 0.2

telegram:
  enabled: true
  bot_token_env: TELEGRAM_BOT_TOKEN
  chat_id_env: TELEGRAM_CHAT_ID
