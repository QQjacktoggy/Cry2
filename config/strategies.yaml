strategies:
  # =============================================
  # V5 配置 — 加入 BNB（3幣種組合：BTC+ETH+BNB+XRP）
  # Sharpe 1.969 | Ann Return 37.4% | MaxDD -13.8% | Calmar 2.70
  # =============================================

  # 🟢 長線核心 (42% 資金) — 多幣種趨勢追蹤
  momentum_ranking:
    enabled: true
    allocation_eth: 0.14
    allocation_bnb: 0.08
    symbols: [ETHUSDT, BNBUSDT]
    timeframe: 1d
    roc_period: 60
    lookback: 180
    upper_threshold: 80
    lower_threshold: 40
    leverage: 1.5
    regime_filter: [trending_up, trending_down]

  trend_donchian_mtf:
    enabled: true
    allocation: 0.15
    symbols: [BTCUSDT]
    timeframe: 4h
    entry_period: 15
    exit_period: 10
    adx_threshold: 20
    htf_period: 200
    leverage: 2
    regime_filter: [trending_up, trending_down]

  trend_donchian_adx_slope:
    enabled: true
    allocation: 0.05
    symbols: [BTCUSDT]
    timeframe: 4h
    entry_period: 20
    exit_period: 10
    adx_slope_bars: 5
    adx_slope_min: 0.3
    leverage: 2
    regime_filter: [trending_up]

  # 🟡 短線補位 (30% 資金) — 盤整期獲利
  grid_trend_bias:
    enabled: true
    allocation_eth: 0.22
    allocation_xrp: 0.06
    symbols: [ETHUSDT, XRPUSDT]
    timeframe: 4h
    bb_period: 20
    bb_std: 2.0
    ema_period: 50
    leverage: 2
    regime_filter: [ranging]

  breakout_squeeze:
    enabled: true
    allocation: 0.08
    symbols: [BTCUSDT]
    timeframe: 4h
    bb_period: 30
    bb_std: 2.5
    kc_ema_period: 15
    kc_atr_period: 7
    kc_mult: 2.0
    leverage: 2
    regime_filter: [ranging]

  # 🔵 Phase 7 優化 + BNB 擴展 (22% 資金)
  tail_risk_hedge:
    enabled: true
    allocation_btc: 0.07
    allocation_bnb: 0.05
    symbols: [BTCUSDT, BNBUSDT]
    timeframe: 1d
    consec_up_threshold: 14
    consec_down_threshold: 5
    exit_bars: 10
    leverage: 1
    regime_filter: [volatile]

  dual_channel_breakout:
    enabled: true
    allocation: 0.10
    symbols: [ETHUSDT]
    timeframe: 4h
    dc_period: 30
    kc_ema: 15
    kc_atr: 14
    kc_mult: 2.0
    adx_period: 14
    adx_threshold: 20
    leverage: 2
    regime_filter: [trending_up, trending_down]

  # ❌ 移除策略
  trend_donchian:
    enabled: false
    allocation: 0.00
  regime_switcher:
    enabled: false
    allocation: 0.00
  mean_reversion_bb:
    enabled: false
    allocation: 0.00
  grid_funding_aware:
    enabled: false
    allocation: 0.00
  long_horizon_eth:
    enabled: false
    allocation: 0.00
  pv_divergence:
    enabled: false
    allocation: 0.00

# =============================================
# V5 資金配置摘要 (100%) — 4幣種 10策略位
# =============================================
capital_allocation:
  # 長線核心 42%
  momentum_ranking_eth: 0.14
  momentum_ranking_bnb: 0.08
  trend_donchian_mtf: 0.15
  trend_donchian_adx_slope: 0.05
  # 短線補位 30%
  grid_trend_bias_eth: 0.22
  grid_trend_bias_xrp: 0.06
  breakout_squeeze: 0.08
  # Phase 7 + BNB 22%
  tail_risk_hedge_btc: 0.07
  tail_risk_hedge_bnb: 0.05
  dual_channel_breakout: 0.10

# =============================================
# 市場環境感知配置 (Phase 4)
# =============================================
regime_detection:
  adx_period: 14
  adx_trend_threshold: 25
  adx_range_threshold: 20
  ema_period: 50
  atr_period: 14
  atr_lookback: 100
  atr_volatile_percentile: 80
  min_regime_bars: 3

regime_strategy_routing:
  trending_up:
    - momentum_ranking
    - trend_donchian
    - trend_donchian_mtf
    - trend_donchian_adx_slope
  trending_down:
    - momentum_ranking
    - trend_donchian
  ranging:
    - grid_trend_bias
    - breakout_squeeze
  volatile: []

regime_sizing:
  trending_up: 1.0
  trending_down: 0.7
  ranging: 0.8
  volatile: 0.3
