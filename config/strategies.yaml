strategies:
  # =============================================
  # V4 配置 — 優化Phase 7參數 + dual_channel_breakout替換弱策略
  # Sharpe 1.685 | Ann Return 35.1% | MaxDD -16.7% | Calmar 2.10
  # =============================================

  # 🟢 長線核心 (43% 資金) — 穩定趨勢追蹤
  momentum_ranking:
    enabled: true
    allocation: 0.20
    symbols: [BTCUSDT, ETHUSDT, SOLUSDT]
    timeframe: 1d
    roc_period: 60
    lookback: 180
    upper_threshold: 80
    lower_threshold: 40
    leverage: 1.5
    regime_filter: [trending_up, trending_down]

  trend_donchian_mtf:
    enabled: true
    allocation: 0.15
    symbols: [BTCUSDT, ETHUSDT]
    timeframe: 4h
    entry_period: 15
    exit_period: 10
    adx_threshold: 20
    htf_period: 200
    leverage: 2
    regime_filter: [trending_up, trending_down]

  trend_donchian_adx_slope:
    enabled: true
    allocation: 0.08
    symbols: [BTCUSDT, ETHUSDT]
    timeframe: 4h
    entry_period: 20
    exit_period: 10
    adx_slope_bars: 5
    adx_slope_min: 0.3
    leverage: 2
    regime_filter: [trending_up]

  # 🟡 短線補位 (37% 資金) — 盤整期獲利
  grid_trend_bias:
    enabled: true
    allocation: 0.25
    symbols: [BTCUSDT, ETHUSDT]
    timeframe: 4h
    bb_period: 20
    bb_std: 2.0
    ema_period: 50
    leverage: 2
    regime_filter: [ranging]

  breakout_squeeze:
    enabled: true
    allocation: 0.12
    symbols: [BTCUSDT, ETHUSDT]
    timeframe: 4h
    bb_period: 30
    bb_std: 2.5
    kc_ema_period: 15
    kc_atr_period: 7
    kc_mult: 2.0
    leverage: 2
    regime_filter: [ranging]

  # 🔵 Phase 7 優化策略 (20% 資金) — 參數優化後表現
  tail_risk_hedge:
    enabled: true
    allocation: 0.10
    symbols: [BTCUSDT]
    timeframe: 1d
    consec_up_threshold: 14
    consec_down_threshold: 5
    exit_bars: 10
    leverage: 1
    regime_filter: [volatile]

  dual_channel_breakout:
    enabled: true
    allocation: 0.10
    symbols: [ETHUSDT]
    timeframe: 4h
    dc_period: 30
    kc_ema: 15
    kc_atr: 14
    kc_mult: 2.0
    adx_period: 14
    adx_threshold: 20
    leverage: 2
    regime_filter: [trending_up, trending_down]

  # ❌ 移除策略
  trend_donchian:
    enabled: false    # Sharpe 0.26, DD -48.5%
    allocation: 0.00
  regime_switcher:
    enabled: false    # Sharpe 0.15, DD -35.7%
    allocation: 0.00
  mean_reversion_bb:
    enabled: false    # Sharpe -1.40, DD -53.5%
    allocation: 0.00
  grid_funding_aware:
    enabled: false    # Return -17.9%
    allocation: 0.00
  long_horizon_eth:
    enabled: false    # Sharpe 0.06, low return → replaced by dual_channel_breakout
    allocation: 0.00
  pv_divergence:
    enabled: false    # Only 3 trades after optimization → unreliable
    allocation: 0.00

# =============================================
# V4 資金配置摘要 (100%)
# =============================================
capital_allocation:
  # 長線核心 43%
  momentum_ranking: 0.20
  trend_donchian_mtf: 0.15
  trend_donchian_adx_slope: 0.08
  # 短線補位 37%
  grid_trend_bias: 0.25
  breakout_squeeze: 0.12
  # Phase 7 優化 20%
  tail_risk_hedge: 0.10
  dual_channel_breakout: 0.10

# =============================================
# 市場環境感知配置 (Phase 4)
# =============================================
regime_detection:
  adx_period: 14
  adx_trend_threshold: 25
  adx_range_threshold: 20
  ema_period: 50
  atr_period: 14
  atr_lookback: 100
  atr_volatile_percentile: 80
  min_regime_bars: 3

regime_strategy_routing:
  trending_up:
    - momentum_ranking
    - trend_donchian
    - trend_donchian_mtf
    - trend_donchian_adx_slope
  trending_down:
    - momentum_ranking
    - trend_donchian
  ranging:
    - grid_trend_bias
    - breakout_squeeze
  volatile: []

regime_sizing:
  trending_up: 1.0
  trending_down: 0.7
  ranging: 0.8
  volatile: 0.3
