  position_sizing:
    method: atr_based
    risk_per_trade: 0.02
    min_position_pct: 0.10
    max_position_pct: 0.50

  adaptive_leverage:
    max_leverage: 3.0
    min_leverage: 1.0
    atr_high_pct: 80
    atr_low_pct: 20

  consecutive_loss:
    max_consecutive: 5
    pause_bars: 24

  max_hold:
    long_term_bars: 120        # ~20 days at 4h
    short_term_bars: 168       # ~7 days at 1h

