risk_limits:
  # Per trade
  max_risk_per_trade_pct: 1.0
  max_position_value_pct: 20.0
  max_leverage: 3
  hard_max_leverage: 5

  # Daily
  daily_loss_limit_pct: 3.0
  daily_trade_count_limit: 50

  # Weekly
  weekly_loss_limit_pct: 8.0

  # Portfolio drawdown protection (V7.3 — disabled in backtest, used in live)
  # Analysis: 3A DD stop hurts backtest returns (close price ≠ portfolio equity).
  # Kept for live trading safety net where real equity can diverge.
  max_drawdown_pct: 20.0
  drawdown_cooldown_bars: 48       # 8 days at 4h

  # Consecutive loss protection (V7.3 Phase D optimized)
  # Calibrated: 4 consecutive losses triggers pause, 24-bar cooldown (~4 days at 4h)
  # Impact: Sharpe +0.039, MaxDD -0.2%, Calmar +0.20 vs no risk controls
  max_consecutive_losses: 4
  loss_cooldown_bars: 24           # 4 days at 4h

  # Maximum holding time (V7.3 Phase D optimized)
  # Forced exit after 180 bars long (30 days at 4h) / 150 bars short (25 days)
  # Prevents trend strategies from holding through extended adverse moves
  max_hold_bars_long: 180
  max_hold_bars_short: 150

  # Margin
  maintenance_margin_ratio_min: 50

  # Circuit breaker
  circuit_breaker_bar_pct: 5.0
  circuit_breaker_cooldown_min: 30

  # Kill switch
  max_consecutive_errors: 5
  max_api_latency_ms: 3000
  ws_disconnect_timeout_sec: 60
  ws_kill_switch_timeout_sec: 300

  # Auto-deleveraging
  margin_reduce_threshold_pct: 50
  margin_reduce_amount_pct: 30
