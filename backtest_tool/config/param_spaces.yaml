# 參數掃描空間定義
param_spaces:
  trend_donchian:
    entry_period: [10, 15, 20, 25, 30, 40]
    exit_period: [5, 7, 10, 15]
    adx_threshold: [20, 25, 30, 35]
    atr_stop_mult: [1.0, 1.5, 2.0, 2.5, 3.0]
    leverage: [1, 2, 3]

  mean_reversion_bb:
    bb_period: [15, 20, 25, 30]
    bb_std: [1.5, 2.0, 2.5, 3.0]
    rsi_period: [10, 14, 21]
    rsi_oversold: [20, 25, 30, 35]
    rsi_overbought: [65, 70, 75, 80]
    leverage: [1, 2]

  grid_futures:
    grid_count: [10, 15, 20, 30]
    ema_period: [100, 150, 200]
    leverage: [1, 2, 3]

  funding_arb:
    funding_rate_threshold_annual: [10, 12, 15, 20, 25]
    funding_rate_exit_annual: [3, 5, 7, 10]
    max_hold_days: [3, 5, 7, 14]

  momentum_ranking_v2:
    roc_period:     [20, 30, 40]
    lookback:       [60, 90, 120]
    upper_pct:      [65, 70, 75]
    lower_pct:      [25, 30, 35]
    adx_threshold:  [15, 20, 25]
    atr_mult:       [1.5, 2.0, 2.5, 3.0]

  grid_trend_bias_v2:
    bb_period:      [15, 20, 25]
    bb_std:         [1.5, 2.0, 2.5]
    ema_period:     [100, 150, 200]
    rsi_oversold:   [30, 35, 40]
    rsi_overbought: [60, 65, 70]
    atr_mult:       [2.0, 2.5, 3.0]

  # H: 短線 1h 策略參數空間
  quick_bb_reversion_1h:
    bb_period:      [15, 20, 25]
    bb_std:         [1.5, 2.0, 2.5]
    rsi_oversold:   [38, 42, 46]
    rsi_overbought: [54, 58, 62]
    atr_mult:       [1.0, 1.5, 2.0]
  # 共 3×3×3×3×3 = 243 種組合

  macd_scalper_1h:
    macd_fast:    [8, 12, 16]
    macd_slow:    [21, 26, 34]
    macd_signal:  [7, 9, 12]
    ema_period:   [100, 150, 200]
    atr_mult:     [1.0, 1.5, 2.0]
  # 共 3×3×3×3×3 = 243 種組合

  supertrend_scalper_1h:
    st_period:    [7, 10, 14]
    st_mult:      [2.0, 2.5, 3.0, 3.5]
    ema_period:   [30, 50, 100]
    atr_mult:     [1.5, 2.0, 2.5]
  # 共 3×4×3×3 = 108 種組合

# 組合最佳化
portfolio_optimization:
  allocation_step: 0.05           # 5% 步進
  min_allocation: 0.0             # 最小配置比例
  max_allocation: 0.80            # 最大配置比例（單策略不超過 80%）
  target_metric: sharpe_ratio     # 最佳化目標
