<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-card: #1c2333;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --accent: #00d4aa;
            --profit: #00d4aa;
            --loss: #ff4136;
            --border: #30363d;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            line-height: 1.6;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { color: var(--accent); font-size: 1.8em; margin-bottom: 5px; }
        h2 { color: var(--text-primary); margin: 30px 0 15px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        h3 { color: var(--text-secondary); margin: 20px 0 10px; }
        .header { margin-bottom: 30px; }
        .header .subtitle { color: var(--text-secondary); font-size: 0.95em; }
        .header .meta { color: var(--text-secondary); font-size: 0.85em; margin-top: 5px; }

        /* Metrics cards */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            margin: 15px 0;
        }
        .metric-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
        }
        .metric-card .label { color: var(--text-secondary); font-size: 0.8em; text-transform: uppercase; }
        .metric-card .value { font-size: 1.3em; font-weight: 600; margin-top: 4px; }
        .profit-text { color: var(--profit); }
        .loss-text { color: var(--loss); }

        /* Charts */
        .chart-container { margin: 20px 0; }

        /* Trade table */
        .trade-log { overflow-x: auto; margin: 20px 0; }
        .trades-table, .tearsheet-table, .comparison-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85em;
        }
        .trades-table th, .tearsheet-table th, .comparison-table th {
            background: var(--bg-secondary);
            color: var(--text-secondary);
            padding: 10px 12px;
            text-align: left;
            position: sticky;
            top: 0;
            border-bottom: 2px solid var(--border);
        }
        .trades-table td, .tearsheet-table td, .comparison-table td {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
        }
        .trades-table tr.profit td { background: rgba(0, 212, 170, 0.05); }
        .trades-table tr.loss td { background: rgba(255, 65, 54, 0.05); }
        .trades-table tr:hover td { background: rgba(255, 255, 255, 0.05); }
        .summary-row td { background: var(--bg-secondary) !important; font-weight: 600; }

        /* Tearsheet */
        .tearsheet { margin: 20px 0; }
        .tearsheet-table td { text-align: center; }
        .tearsheet-table td:first-child { text-align: left; }

        /* Config section */
        .config-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            margin: 20px 0;
        }
        .config-section pre {
            font-family: 'Fira Code', monospace;
            font-size: 0.85em;
            color: var(--text-secondary);
        }

        /* Footer */
        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 0.8em;
            text-align: center;
        }

        .no-data { color: var(--text-secondary); font-style: italic; padding: 20px; }

        /* Comparison-specific */
        .comparison-table .best { background: rgba(0, 212, 170, 0.1); }
    </style>
</head>
<body>
    <div class="container">
        {% block content %}{% endblock %}

        <div class="footer">
            <p>Generated by VectorBT Backtest Toolkit v1.0 | {{ generated_at }}</p>
        </div>
    </div>
</body>
</html>
